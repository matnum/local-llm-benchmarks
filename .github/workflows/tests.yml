name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: unittest suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run the test suite
        # Pins the README numbers to the tracked rollups, checks the chart
        # fingerprints, and reproduces consolidated.csv from the run data.
        # The scorer golden tests skip here: tools/score_ll and the fixture
        # GGUF are not in git (see docs/RUNNING.md §9).
        run: python -m unittest discover -s tests -t . -v

      - name: Summarise skips
        if: always()
        run: |
          echo "Tests that skip on a clean checkout:"
          echo "  test_score_ll.* — needs the compiled scorer + fixture GGUF"
          echo "  test_defaults.test_live_mesa_probe_reports_mesa_when_the_box_has_it"
          echo "    — the runner has no vulkaninfo/Mesa; the parsing and the run.json"
          echo "      stamp are pinned by tests that need no GPU."
