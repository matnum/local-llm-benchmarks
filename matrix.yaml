# Frozen benchmark matrix — GGUF files in ~/.local/share/models/ (decision D1).
# Sizes are the exact GGUF files (verified on-disk 2026-09-30 for the original
# five). The "next round" cells (tiny/small/mid/big dense, below) need a one-time
# wget download before they can be swept.
# Bench params are per-cell overridable; `defaults` below are the sweep standard.
# `defaults` is the single source of truth for run parameters: run_sweep.py's
# build_parser() reads it to set the argparse defaults, so editing a value here
# changes the sweep (each flag also overridable per run on the CLI).

defaults:
  backends: [vulkan, rocm]        # vulkan = build-vulkan (reference), rocm = build (HIP)
  gpu_layers: all
  threads_cpu: 16                 # physical threads, Vulkan CPU-side
  ctx_size: 8192
  pp_tokens: [512, 2048]          # prompt-processing sweep points
  tg_tokens: 512                  # generation length (README: 512-token outputs)
  repeats: 3
  warmup_requests: 1              # TTFT probe: discard first timed request
  power_sample_hz: 5

cells:
  - id: gpt-oss-120b-mxfp4
    tier: big
    model: gpt-oss-120b
    arch: moe
    quant: MXFP4 (native)
    file: ~/.local/share/models/gpt-oss-120b/gpt-oss-120b-MXFP4.gguf
    size_gib: 59.0
    note: headline "120B on a 128 GB APU" cell

